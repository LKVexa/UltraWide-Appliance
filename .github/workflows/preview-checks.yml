name: Preview checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check arithmetic and input boundaries
        run: python -m unittest discover -s tests -v
      - name: Verify the full-width self-test
        run: python -m ultrawide self-test
      - name: Run the checked-in program
        run: python -m ultrawide run examples/high-bit.uwa
      - name: Exercise the restored SHS machine
        run: python -m ultrawide shs run examples/shs-control-memory-stack.lctlw
      - name: Verify and execute complete BRIM program words
        run: |
          python -m ultrawide chain verify examples/brim-word-chain.brw
          python -m ultrawide chain run examples/brim-word-chain.brw
          python -m ultrawide chain pack "$RUNNER_TEMP/rebuilt.brw" examples/brim-top-bit.lctlb examples/brim-wrap-next.lctlb
          cmp examples/brim-word-chain.brw "$RUNNER_TEMP/rebuilt.brw"
      - name: Validate the source overlay
        run: python scripts/build_iso.py --check
      - name: Compile source and build scripts
        run: python -m compileall -q src scripts
