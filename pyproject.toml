[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrawide-appliance-preview"
version = "0.2.0"
description = "BASIC-1048576 virtual appliance with lossless LCTL-WIDE translation and BRIM image binding"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Product-Preview-Tester-1.1"
license-files = ["LICENSE"]
authors = [{name = "RUSSELL PHILIP SMITHSON"}]
dependencies = []

[project.scripts]
ultrawide = "ultrawide.__main__:main"

[project.urls]
Repository = "https://github.com/LKVexa/UltraWide-Appliance"
Issues = "https://github.com/LKVexa/UltraWide-Appliance/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ultrawide.shs" = ["PROVENANCE.json"]
